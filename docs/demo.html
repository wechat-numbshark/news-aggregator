<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>新闻聚合 · 演示</title><style>
:root{--bg:#0e1320;--panel:#182132;--line:#2c3b50;--text:#ecf2f8;--muted:#aab9cd;--blue:#64aaff;--green:#74d8a3;--yellow:#f8ca70}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.shell{max-width:1580px;margin:26px auto;padding:0 24px}.top{display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:800;font-size:25px}.tabs{display:flex;gap:8px;margin-left:25px}.tab{padding:10px 16px;border-radius:9px;color:var(--muted);text-decoration:none}.tab.active{background:#243c59;color:#fff}.right{margin-left:auto;display:flex;gap:10px;align-items:center}.tag{border:1px solid #6b5140;background:#493a2a;color:#ffdb9f;padding:7px 11px;border-radius:8px;font-size:13px;font-weight:700}.button{background:#3275cd;color:#fff;padding:10px 16px;border-radius:9px;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:end;margin:28px 0 20px}.heading h1{font-size:30px;margin:0}.sub{color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.stat{padding:17px 20px}.stat b{display:block;font-size:27px}.stat span{font-size:13px;color:var(--muted)}.toolbar{display:flex;gap:10px;margin-bottom:18px}.chip{background:#202f44;border:1px solid #344962;border-radius:8px;color:#d8e5f5;padding:7px 12px;font-size:13px}.chip.on{border-color:#5aa7ff;background:#23456b}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{padding:21px 23px}.card .meta{color:#8cb4db;font-size:13px;font-weight:700}.card h2{font-size:20px;line-height:1.4;margin:10px 0}.card p{color:#b9c6d6;margin:0 0 18px}.card footer{display:flex;justify-content:space-between;color:#8597ae;font-size:13px}.brief{display:grid;grid-template-columns:1.8fr 1fr;gap:18px}.panel{padding:26px}.panel h2{font-size:20px;margin:0 0 18px}.brief-item{border-top:1px solid var(--line);padding:16px 0}.brief-item:first-of-type{border-top:0}.brief-item b{color:var(--blue)}.brief-item p{margin:6px 0 0;color:#c7d4e3}.source{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;align-items:center;padding:16px 18px;border-top:1px solid var(--line);font-size:14px}.source:first-of-type{border-top:0;color:#91a3b9;font-weight:700}.ok{color:var(--green)}.note{color:var(--yellow)}.foot{margin-top:18px;color:#7e90a8;font-size:12px;text-align:right}
</style></head><body><main class="shell"><div class="top"><div class="brand">🌐 新闻聚合</div><nav class="tabs"><a class="tab" href="?view=feed">今日文章</a><a class="tab" href="?view=brief">每日简报</a><a class="tab" href="?view=sources">新闻源管理</a></nav><div class="right"><span class="tag">虚构演示数据</span><span class="button">一键采集</span></div></div><div id="content"></div><div class="foot">演示画面：文章、来源和统计均为虚构样本；不代表实时新闻或在线采集结果。</div></main><script>
const view=new URLSearchParams(location.search).get('view')||'feed';document.querySelectorAll('.tab').forEach(a=>a.classList.toggle('active',a.href.endsWith('view='+view)));
const data={feed:`<div class="heading"><div><h1>把分散资讯放进一张可筛选的阅读台</h1><div class="sub">2026-11-12 · 多来源合并、去重、分类、原文追溯</div></div><div class="sub">按国家、语言、分类筛选 →</div></div><div class="stats"><div class="stat"><b>24</b><span>今日样本文章</span></div><div class="stat"><b>6</b><span>候选来源</span></div><div class="stat"><b>3</b><span>语种</span></div><div class="stat"><b>4</b><span>主题分类</span></div></div><div class="toolbar"><span class="chip on">全部国家</span><span class="chip">🇨🇳 中国</span><span class="chip">🇯🇵 日本</span><span class="chip">🇺🇸 美国</span><span class="chip on">全部语言</span><span class="chip">科技</span><span class="chip">创业</span></div><div class="cards"><article class="card"><div class="meta">科技 · 日本 · 日本語 · 09:20</div><h2>示例：研究团队发布开放数据工具</h2><p>原文链接与来源时间一起保留。摘要帮助快速判断是否值得点开，不代替原始报道。</p><footer><span>示例科技日报 · RSS</span><span>查看原文 ↗</span></footer></article><article class="card"><div class="meta">创业 · 美国 · English · 08:45</div><h2>Example: Startup announces a developer platform</h2><p>跨语言文章可汇总到同一列表，并按来源国、主题和翻译状态继续筛选。</p><footer><span>Sample Startup Feed · RSSHub</span><span>Open original ↗</span></footer></article><article class="card"><div class="meta">宏观 · 中国 · 中文 · 07:35</div><h2>示例：城市发布新的产业扶持计划</h2><p>候选来源需要逐项测试。列表不会把来源失效误当成“今天没有新闻”。</p><footer><span>示例政策观察 · RSS</span><span>查看原文 ↗</span></footer></article><article class="card"><div class="meta">机会 · 全球 · English · 06:10</div><h2>Example: Open-source funding round-up</h2><p>适合自建个人研究台：先收集可追溯链接，再用可选 AI 简报压缩阅读时间。</p><footer><span>Sample Global Feed · GDELT</span><span>Open original ↗</span></footer></article></div>`,brief:`<div class="heading"><div><h1>读完 24 篇，先看一页重点</h1><div class="sub">AI 简报是可选能力；每条结论都应回到原始文章核对</div></div><div class="tag">虚构简报 · 2026-11-12</div></div><div class="stats"><div class="stat"><b>24</b><span>候选文章</span></div><div class="stat"><b>4</b><span>重点主题</span></div><div class="stat"><b>6</b><span>来源</span></div><div class="stat"><b>0</b><span>演示推送次数</span></div></div><div class="brief"><section class="panel"><h2>📋 今日简报</h2><div class="brief-item"><b>01 · 开发工具</b><p>多个示例来源讨论开放数据与开发平台。建议先核对产品文档、价格和发布时间，再判断机会。</p></div><div class="brief-item"><b>02 · 创业动态</b><p>新服务值得关注的点是目标用户与迁移成本。简报保留原始链接，避免把模型判断当作事实。</p></div><div class="brief-item"><b>03 · 区域政策</b><p>政策类消息需要核对政府原文、适用地区与生效日期。这里只提供阅读线索。</p></div><div class="brief-item"><b>04 · 下一步</b><p>收藏 3 条值得深读的原文，忽略重复转述；来源不可用时先检查源健康状态。</p></div></section><aside class="panel"><h2>为什么有用</h2><div class="brief-item"><b>节省筛选时间</b><p>从多来源到主题脉络，先判断要不要读。</p></div><div class="brief-item"><b>保留证据链</b><p>标题、来源、时间、原文链接都可回查。</p></div><div class="brief-item"><b>可控推送</b><p>默认不推送；配置自己的模型和 Webhook 后再启用。</p></div></aside></div>`,sources:`<div class="heading"><div><h1>看得见哪些来源正常、哪些失效</h1><div class="sub">每个源可单独测试；RSSHub 路由和外部 API 由使用者自行配置</div></div><div class="button">测试全部来源</div></div><div class="stats"><div class="stat"><b>6</b><span>示例候选来源</span></div><div class="stat"><b>4</b><span>正常样本</span></div><div class="stat"><b>1</b><span>需配置样本</span></div><div class="stat"><b>1</b><span>故障样本</span></div></div><section class="panel"><div class="source"><span>来源</span><span>类型</span><span>主题</span><span>状态</span><span>最近检查</span></div><div class="source"><b>示例科技日报</b><span>RSS</span><span>科技</span><span class="ok">● 正常</span><span>10:12</span></div><div class="source"><b>Sample Startup Feed</b><span>RSSHub</span><span>创业</span><span class="ok">● 正常</span><span>10:11</span></div><div class="source"><b>示例政策观察</b><span>RSS</span><span>宏观</span><span class="ok">● 正常</span><span>10:10</span></div><div class="source"><b>Sample Global Feed</b><span>GDELT</span><span>全球</span><span class="ok">● 正常</span><span>10:08</span></div><div class="source"><b>NYT API（示例）</b><span>API</span><span>通用</span><span class="note">◆ 需配置 Key</span><span>—</span></div><div class="source"><b>示例失效源</b><span>RSS</span><span>科技</span><span style="color:#ff9090">● 请求失败</span><span>10:06</span></div></section>`};document.getElementById('content').innerHTML=data[view]||data.feed;
</script></body></html>
