# ──────────────────── 🌍 全球覆盖补充 ────────────────────

global:
  - id: gdelt_cn
    name: GDELT（中国相关）
    country: GLOBAL
    lang: mixed
    type: gdelt
    gdelt_query: "China OR 中国"
    gdelt_mode: ArtList
    gdelt_timespan: 1w
    interval: 900
    categories: [macro, general]

  - id: gdelt_finance
    name: GDELT（全球财经）
    country: GLOBAL
    lang: mixed
    type: gdelt
    gdelt_query: "stock market OR economy OR investment"
    gdelt_mode: ArtList
    gdelt_timespan: 1w
    interval: 900
    categories: [stock_us, macro]

  - id: gdelt_startup
    name: GDELT（创业投资）
    country: GLOBAL
    lang: mixed
    type: gdelt
    gdelt_query: "startup OR venture capital OR IPO OR funding"
    gdelt_mode: ArtList
    gdelt_timespan: 1w
    interval: 1800
    categories: [startup, opportunity]
